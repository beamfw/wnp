[package]
name = "wnp-core"
version = "2.0.0"
edition = "2021"
authors = ["Beam Framework Contributors <beamfw@gmail.com>"]
description = "Core Web Node Protocol (WNP) engine in Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
jwt = "0.16"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["wasm-bindgen"]
